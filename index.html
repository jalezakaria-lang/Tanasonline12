<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator Surat & SPD Otomatis - Inspektorat Kota Malang</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      #paper { 
        box-shadow: none !important; 
        border: none !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col justify-between">

  <div id="app"></div>

  <!-- Modal Login Sementara -->
  <div id="loginModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-slate-900">Masuk ke Sistem</h3>
        <button onclick="toggleLoginModal(false)" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Username / NIP</label>
          <input type="text" id="loginUser" required placeholder="Masukkan Username / NIP" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kata Sandi</label>
          <input type="password" id="loginPass" required placeholder="••••••••" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm shadow transition">
          Masuk Sekarang
        </button>
      </form>
      <p class="text-[11px] text-slate-400 text-center mt-4">*Fitur simulasi login sementara untuk demo presentasi.</p>
    </div>
  </div>

  <script>
    // State Utama Aplikasi
    const state = {
      currentPage: 'landing',
      isLoggedIn: false,
      user: null,
      
      riwayatPenugasan: [],

      formData: {
        namaInstansi: 'PEMERINTAH KOTA MALANG',
        unitKerja: 'INSPEKTORAT DAERAH',
        alamatInstansi: 'Jalan Simpang Majapahit Nomor 1, Kiduldalem, Klojen, Kota Malang, Jawa Timur 65119,\nTelepon (0341) 364450, Faksimile (0341) 364450,\nLaman inspektoratdaerah.malangkota.go.id, Pos-el inspektoratmalangkota@gmail.com',
        nomorSurat: '800.1.11.1/       /35.73.300/2026',
        dasarSurat: '',
        
        // Array Pegawai yang Ditugaskan (KOSONG DEFAULT)
        pegawaiList: [
          { nama: '', nip: '', pangkatGol: '', jabatan: '' }
        ],

        maksudTugas: '',
        laporanTugas: 'Melaporkan hasil pelaksanaan tugas kepada Plt. Inspektur Daerah.',
        kotaTanggal: '',
        jabatanPenandatangan: 'Plt. Inspektur Daerah,',
        namaPenandatangan: '',
        pangkatPenandatangan: '',
        nipPenandatangan: ''
      }
    };

    function renderApp() {
      const appNode = document.getElementById('app');
      if (state.currentPage === 'landing') {
        renderLandingPage(appNode);
      } else if (state.currentPage === 'dashboard') {
        renderDashboardPage(appNode);
      } else if (state.currentPage === 'generator') {
        renderGeneratorPage(appNode);
      }
    }

    function navigateTo(page) {
      state.currentPage = page;
      renderApp();
    }

    function toggleLoginModal(show) {
      const modal = document.getElementById('loginModal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const userVal = document.getElementById('loginUser').value;
      state.isLoggedIn = true;
      state.user = { name: userVal || 'Admin Inspektorat' };
      toggleLoginModal(false);
      navigateTo('dashboard');
    }

    function handleLogout() {
      state.isLoggedIn = false;
      state.user = null;
      navigateTo('landing');
    }

    function getSidebarHTML(activeMenu) {
      return `
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between min-h-screen no-print">
          <div>
            <div class="p-5 border-b border-slate-800 flex items-center gap-3">
              <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xs">INSP</div>
              <span class="font-bold text-white text-base tracking-tight">Surat & SPD</span>
            </div>
            <nav class="p-4 space-y-1">
              <button onclick="navigateTo('landing')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${activeMenu === 'landing' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 hover:text-white transition'}">
                <span>🏠</span> Halaman Depan
              </button>
              <button onclick="navigateTo('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${activeMenu === 'dashboard' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 hover:text-white transition'}">
                <span>📊</span> Dashboard
              </button>
              <button onclick="buatPenugasanBaru()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${activeMenu === 'generator' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 hover:text-white transition'}">
                <span>➕</span> Penugasan Baru
              </button>
            </nav>
          </div>
          <div class="p-4 border-t border-slate-800">
            ${state.isLoggedIn ? `
              <div class="mb-3 px-2">
                <p class="text-[10px] text-slate-400">Pengguna Aktif:</p>
                <p class="text-xs font-bold text-white truncate">${state.user.name}</p>
              </div>
              <button onclick="handleLogout()" class="w-full bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white py-2 rounded-lg text-xs font-bold transition">Keluar</button>
            ` : `
              <button onclick="toggleLoginModal(true)" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-xs font-bold transition">Masuk Akses</button>
            `}
          </div>
        </aside>
      `;
    }

    function renderLandingPage(container) {
      container.innerHTML = `
        <header class="bg-white border-b sticky top-0 z-40">
          <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('landing')">
              <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xs">INSP</div>
              <span class="font-bold text-lg text-slate-900">Inspektorat Surat System</span>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="navigateTo('dashboard')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold px-4 py-2 rounded-lg transition">Dashboard</button>
              ${state.isLoggedIn ? `
                <button onclick="handleLogout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-semibold px-4 py-2 rounded-lg transition">Keluar</button>
              ` : `
                <button onclick="toggleLoginModal(true)" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Masuk</button>
              `}
            </div>
          </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-20 text-center flex-grow">
          <span class="bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1 rounded-full border border-blue-100">✨ Inspektorat Daerah Kota Malang</span>
          <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 mt-4 mb-6 leading-tight">Sistem Administrasi Penugasan <br/>& Perjalanan Dinas</h1>
          <p class="text-slate-600 max-w-2xl mx-auto mb-8 text-base">Platform pembuatan Surat Tugas resmi Inspektorat Daerah Kota Malang presisi sesuai standard format.</p>
          <div class="flex gap-4 justify-center">
            <button onclick="buatPenugasanBaru()" class="px-8 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition">Buat Penugasan Baru &rarr;</button>
            <button onclick="navigateTo('dashboard')" class="px-8 py-3.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl transition">Buka Dashboard</button>
          </div>
        </main>
      `;
    }

    function renderDashboardPage(container) {
      const totalPenugasan = state.riwayatPenugasan.length;
      
      container.innerHTML = `
        <div class="flex min-h-screen bg-slate-50">
          ${getSidebarHTML('dashboard')}
          
          <main class="flex-1 p-8 overflow-y-auto">
            <div class="flex justify-between items-center mb-8">
              <div>
                <h1 class="text-2xl font-bold text-slate-900">Dashboard Penugasan</h1>
                <p class="text-xs text-slate-500">Inspektorat Daerah Kota Malang</p>
              </div>
              <button onclick="buatPenugasanBaru()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold px-4 py-2 rounded-lg shadow transition">
                + Penugasan Baru
              </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
              <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-slate-500 uppercase">Total Surat Diterbitkan</p>
                <p class="text-3xl font-extrabold text-slate-900 mt-2">${totalPenugasan}</p>
              </div>
              <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-slate-500 uppercase">Tugas Aktif/Berjalan</p>
                <p class="text-3xl font-extrabold text-blue-600 mt-2">0</p>
              </div>
              <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-slate-500 uppercase">Selesai</p>
                <p class="text-3xl font-extrabold text-emerald-600 mt-2">0</p>
              </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h2 class="font-bold text-slate-800">Daftar Penugasan Terbaru</h2>
              </div>
              
              ${totalPenugasan === 0 ? `
                <div class="p-12 text-center">
                  <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">📋</div>
                  <h3 class="font-bold text-slate-700 mb-1">Belum Ada Penugasan</h3>
                  <p class="text-xs text-slate-500 mb-6">Daftar penugasan masih kosong. Silakan buat dokumen penugasan baru.</p>
                  <button onclick="buatPenugasanBaru()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-lg shadow transition">
                    + Buat Penugasan Baru
                  </button>
                </div>
              ` : `
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-slate-700 uppercase text-xs font-bold border-b">
                      <tr>
                        <th class="p-4">ID / No. Surat</th>
                        <th class="p-4">Jumlah Pegawai</th>
                        <th class="p-4">Maksud Tugas</th>
                        <th class="p-4 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      ${state.riwayatPenugasan.map(item => `
                        <tr class="hover:bg-slate-50">
                          <td class="p-4 font-mono font-medium text-slate-900">${item.nomorSurat}</td>
                          <td class="p-4 font-semibold text-slate-800">${item.jumlahPegawai} Orang</td>
                          <td class="p-4 max-w-xs truncate">${item.maksudTugas}</td>
                          <td class="p-4 text-center">
                            <button onclick="editPenugasan('${item.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded font-medium">Edit / Cetak</button>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </main>
        </div>
      `;
    }

    function renderGeneratorPage(container) {
      const d = state.formData;
      container.innerHTML = `
        <div class="flex min-h-screen bg-slate-50">
          ${getSidebarHTML('generator')}

          <main class="flex-1 p-6 overflow-y-auto">
            <div class="mb-4 flex justify-between items-center no-print">
              <span class="text-xs font-bold bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Mode Edit Surat Tugas</span>
              <button onclick="simpanKeRiwayat()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-lg shadow transition">
                Simpan ke Dashboard
              </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <!-- Form Input -->
              <div class="lg:col-span-5 bg-white p-6 rounded-xl shadow-md h-fit no-print">
                <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b">Form Penugasan</h2>
                <form onsubmit="return false;" class="space-y-4 max-h-[70vh] overflow-y-auto pr-2">
                  
                  <div class="bg-slate-50 p-3 rounded-lg border">
                    <h3 class="text-xs font-bold text-slate-500 uppercase mb-2">Surat & Dasar</h3>
                    <div class="space-y-2 text-xs">
                      <div>
                        <label class="block text-[10px] text-slate-500">Nomor Surat</label>
                        <input type="text" id="inputNomorSurat" value="${d.nomorSurat}" placeholder="Nomor Surat" class="w-full p-2 border rounded" />
                      </div>
                      <div>
                        <label class="block text-[10px] text-slate-500">Dasar Surat Penugasan</label>
                        <textarea id="inputDasarSurat" rows="3" placeholder="Contoh: Surat Plt. Inspektur Daerah tanggal 13 November 2025 nomor: 800.1.12.5/1051/35.73.300/2025 hal: Permohonan Narasumber" class="w-full p-2 border rounded">${d.dasarSurat}</textarea>
                      </div>
                    </div>
                  </div>

                  <!-- Dynamic Input Pegawai Ditugaskan -->
                  <div class="bg-slate-50 p-3 rounded-lg border">
                    <div class="flex justify-between items-center mb-2">
                      <h3 class="text-xs font-bold text-slate-500 uppercase">Daftar Pegawai Ditugaskan</h3>
                      <button onclick="tambahPegawai()" class="text-[11px] bg-blue-50 text-blue-600 hover:bg-blue-100 font-semibold px-2 py-0.5 rounded border border-blue-200">+ Tambah Pegawai</button>
                    </div>
                    <div id="pegawaiInputContainer" class="space-y-3">
                      <!-- Rendered Dynamically -->
                    </div>
                  </div>

                  <div class="bg-slate-50 p-3 rounded-lg border">
                    <h3 class="text-xs font-bold text-slate-500 uppercase mb-2">Tujuan & Maksud Tugas</h3>
                    <div class="space-y-2 text-xs">
                      <div>
                        <label class="block text-[10px] text-slate-500">Poin 1: Maksud & Lokasi Tugas</label>
                        <textarea id="inputMaksudTugas" rows="4" placeholder="Contoh: Melakukan Focus Group Discussion dalam rangka... bertempat di Hotel..." class="w-full p-2 border rounded">${d.maksudTugas}</textarea>
                      </div>
                      <div>
                        <label class="block text-[10px] text-slate-500">Poin 2: Laporan Tugas</label>
                        <input type="text" id="inputLaporanTugas" value="${d.laporanTugas}" class="w-full p-2 border rounded" />
                      </div>
                    </div>
                  </div>

                  <div class="bg-slate-50 p-3 rounded-lg border">
                    <h3 class="text-xs font-bold text-slate-500 uppercase mb-2">Penandatangan</h3>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                      <input type="text" id="inputKotaTanggal" value="${d.kotaTanggal}" placeholder="Malang, November 2026" class="col-span-2 p-2 border rounded" />
                      <input type="text" id="inputJabatanPenandatangan" value="${d.jabatanPenandatangan}" placeholder="Jabatan Penandatangan" class="col-span-2 p-2 border rounded" />
                      <input type="text" id="inputNamaPenandatangan" value="${d.namaPenandatangan}" placeholder="Nama Penandatangan" class="col-span-2 p-2 border rounded" />
                      <input type="text" id="inputPangkatPenandatangan" value="${d.pangkatPenandatangan}" placeholder="Pangkat/Gol (misal: Pembina Utama Muda (IV/c))" class="col-span-2 p-2 border rounded" />
                      <input type="text" id="inputNipPenandatangan" value="${d.nipPenandatangan}" placeholder="NIP Penandatangan" class="col-span-2 p-2 border rounded" />
                    </div>
                  </div>

                </form>

                <div class="mt-6 flex gap-2 border-t pt-4">
                  <button onclick="simpanKeRiwayat()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded text-xs font-bold shadow">Simpan Ke Dashboard</button>
                  <button onclick="downloadPDF()" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded text-xs font-bold shadow">Unduh PDF</button>
                </div>
              </div>

              <!-- Live Preview Paper (Font Arial) -->
              <div class="lg:col-span-7 flex justify-center">
                <div id="paper" class="bg-white w-full max-w-[210mm] min-h-[297mm] p-10 shadow-2xl border text-black font-sans text-[11px] leading-relaxed">
                  <!-- Dynamic Preview -->
                </div>
              </div>
            </div>
          </main>
        </div>
      `;

      renderPegawaiInputs();
      attachGeneratorEvents();
      renderPreview();
    }

    function renderPegawaiInputs() {
      const container = document.getElementById('pegawaiInputContainer');
      if (!container) return;

      container.innerHTML = state.formData.pegawaiList.map((p, idx) => `
        <div class="p-2 border rounded bg-white relative space-y-1.5 text-xs">
          <div class="flex justify-between items-center font-bold text-slate-700 text-[11px]">
            <span>Pegawai #${idx + 1}</span>
            ${state.formData.pegawaiList.length > 1 ? `<button onclick="hapusPegawai(${idx})" class="text-rose-500 hover:text-rose-700 text-[10px]">Hapus</button>` : ''}
          </div>
          <input type="text" placeholder="Nama Lengkap & Gelar" value="${p.nama}" oninput="updatePegawai(${idx}, 'nama', this.value)" class="w-full p-1.5 border rounded" />
          <input type="text" placeholder="NIP" value="${p.nip}" oninput="updatePegawai(${idx}, 'nip', this.value)" class="w-full p-1.5 border rounded" />
          <div class="grid grid-cols-2 gap-1.5">
            <input type="text" placeholder="Pangkat/Gol (contoh: Pembina (IV/a))" value="${p.pangkatGol}" oninput="updatePegawai(${idx}, 'pangkatGol', this.value)" class="p-1.5 border rounded" />
            <input type="text" placeholder="Jabatan" value="${p.jabatan}" oninput="updatePegawai(${idx}, 'jabatan', this.value)" class="p-1.5 border rounded" />
          </div>
        </div>
      `).join('');
    }

    function tambahPegawai() {
      state.formData.pegawaiList.push({ nama: '', nip: '', pangkatGol: '', jabatan: '' });
      renderPegawaiInputs();
      renderPreview();
    }

    function hapusPegawai(idx) {
      state.formData.pegawaiList.splice(idx, 1);
      renderPegawaiInputs();
      renderPreview();
    }

    function updatePegawai(idx, field, value) {
      state.formData.pegawaiList[idx][field] = value;
      renderPreview();
    }

    function buatPenugasanBaru() {
      state.formData.dasarSurat = '';
      state.formData.maksudTugas = '';
      state.formData.pegawaiList = [{ nama: '', nip: '', pangkatGol: '', jabatan: '' }];
      navigateTo('generator');
    }

    function simpanKeRiwayat() {
      const newItem = {
        id: `ST-${Date.now()}`,
        nomorSurat: state.formData.nomorSurat,
        jumlahPegawai: state.formData.pegawaiList.length,
        maksudTugas: state.formData.maksudTugas || '-',
      };

      state.riwayatPenugasan.unshift(newItem);
      alert('Surat tugas berhasil disimpan ke dashboard!');
      navigateTo('dashboard');
    }

    function attachGeneratorEvents() {
      const simpleFields = [
        'NomorSurat', 'DasarSurat', 'MaksudTugas', 'LaporanTugas',
        'KotaTanggal', 'JabatanPenandatangan', 'NamaPenandatangan',
        'PangkatPenandatangan', 'NipPenandatangan'
      ];

      simpleFields.forEach(f => {
        const el = document.getElementById(`input${f}`);
        if (el) {
          el.addEventListener('input', (e) => {
            const key = f.charAt(0).toLowerCase() + f.slice(1);
            state.formData[key] = e.target.value;
            renderPreview();
          });
        }
      });
    }

    function renderPreview() {
      const paper = document.getElementById('paper');
      const d = state.formData;

      paper.innerHTML = `
        <!-- Kop Surat Presisi Sesuai Gambar -->
        <div class="flex items-center border-b-2 border-black pb-2 mb-4">
          <div class="w-20 flex-shrink-0 flex justify-center items-center">
            <!-- Logo Kota Malang Placeholder / SVG Sederhana -->
            <svg class="w-16 h-16 text-emerald-600" viewBox="0 0 100 100" fill="currentColor">
              <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#10B981" />
              <polygon points="50,15 80,30 80,70 50,85 20,70 20,30" fill="#F59E0B" />
              <text x="50" y="55" font-size="20" font-weight="bold" fill="white" text-anchor="middle">MALANG</text>
            </svg>
          </div>
          <div class="flex-grow text-center font-sans">
            <h3 class="font-bold text-base tracking-wider uppercase">${d.namaInstansi}</h3>
            <h2 class="font-extrabold text-xl tracking-wide uppercase">${d.unitKerja}</h2>
            <p class="text-[9px] leading-tight mt-0.5 whitespace-pre-line">${d.alamatInstansi}</p>
          </div>
        </div>

        <!-- Judul & Nomor Surat -->
        <div class="text-center my-6">
          <h1 class="font-bold text-sm tracking-widest uppercase">SURAT TUGAS</h1>
          <p class="text-xs">Nomor: ${d.nomorSurat || '[Nomor Surat]'}</p>
        </div>

        <!-- Table Dasar -->
        <table class="w-full mb-4 text-xs">
          <tr class="align-top">
            <td class="w-16 font-normal">Dasar</td>
            <td class="w-4 text-center">:</td>
            <td class="text-justify leading-relaxed">${d.dasarSurat || '[Isi Dasar Surat Penugasan]'}</td>
          </tr>
        </table>

        <!-- Text MENUGASKAN -->
        <div class="text-center font-bold tracking-widest my-4 text-xs">
          MENUGASKAN:
        </div>

        <!-- Table Kepada (Daftar Pegawai) -->
        <table class="w-full mb-4 text-xs">
          <tr class="align-top">
            <td class="w-16">Kepada</td>
            <td class="w-4 text-center">:</td>
            <td>
              ${d.pegawaiList.map((p, i) => `
                <div class="flex align-top ${i > 0 ? 'mt-3' : ''}">
                  <span class="w-6">${i + 1}.</span>
                  <table class="w-full text-xs">
                    <tr><td class="w-24">Nama</td><td class="w-3 text-center">:</td><td class="font-bold uppercase">${p.nama || '[Nama Pegawai]'}</td></tr>
                    <tr><td>NIP</td><td class="text-center">:</td><td>${p.nip || '-'}</td></tr>
                    <tr><td>Pangkat/Gol</td><td class="text-center">:</td><td>${p.pangkatGol || '-'}</td></tr>
                    <tr><td>Jabatan</td><td class="text-center">:</td><td>${p.jabatan || '-'}</td></tr>
                  </table>
                </div>
              `).join('')}
            </td>
          </tr>
        </table>

        <!-- Table Untuk (Poin Tugas) -->
        <table class="w-full mb-8 text-xs">
          <tr class="align-top">
            <td class="w-16">Untuk</td>
            <td class="w-4 text-center">:</td>
            <td>
              <div class="flex align-top mb-2">
                <span class="w-6">1.</span>
                <div class="text-justify leading-relaxed flex-1">${d.maksudTugas || '[Melakukan Focus Group Discussion dalam rangka...]'}</div>
              </div>
              <div class="flex align-top">
                <span class="w-6">2.</span>
                <div class="text-justify leading-relaxed flex-1">${d.laporanTugas}</div>
              </div>
            </td>
          </tr>
        </table>

        <!-- Penandatangan Surat -->
        <div class="mt-12 flex justify-end">
          <div class="w-72 text-left text-xs">
            <p class="ml-12 mb-1">${d.kotaTanggal || 'Malang,   November 2026'}</p>
            <p class="font-bold mb-16">${d.jabatanPenandatangan || 'Plt. Inspektur Daerah,'}</p>
            <p class="font-bold underline">${d.namaPenandatangan || '[Nama Inspektur]'}</p>
            <p>${d.pangkatPenandatangan || '[Pangkat Penandatangan]'}</p>
            <p>NIP. ${d.nipPenandatangan || '-'}</p>
          </div>
        </div>
      `;
    }

    function downloadPDF() {
      const element = document.getElementById('paper');
      const opt = {
        margin:       10,
        filename:     `Surat_Tugas_Inspektorat.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator Surat & SPD Otomatis</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      #paper { 
        box-shadow: none !important; 
        border: none !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col justify-between">

  <div id="app"></div>

  <!-- Modal Login Sementara -->
  <div id="loginModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 w-full max-w-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-slate-900">Masuk ke Sistem</h3>
        <button onclick="toggleLoginModal(false)" class="text-slate-400 hover:text-slate-600 text-sm">✕</button>
      </div>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Username / NIP</label>
          <input type="text" id="loginUser" required placeholder="Masukkan username atau NIP" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kata Sandi</label>
          <input type="password" id="loginPass" required placeholder="••••••••" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm shadow transition">
          Masuk Sekarang
        </button>
      </form>
      <p class="text-[11px] text-slate-400 text-center mt-4">*Fitur simulasi login sementara untuk demo presentasi.</p>
    </div>
  </div>

  <script>
    // State Utama Aplikasi
    const state = {
      currentPage: 'landing', // 'landing' | 'dashboard' | 'generator'
      isLoggedIn: false,
      user: null,
      
      // Data Riwayat Penugasan (DIKOSONGKAN SESUAI PERMINTAAN)
      riwayatPenugasan: [],

      // Form Data Generator Aktif
      formData: {
        namaInstansi: 'PEMERINTAH KOTA MALANG',
        unitKerja: 'DINAS KOMUNIKASI DAN INFORMATIKA',
        alamatInstansi: 'Jl. Tugu No. 1, Malang, Jawa Timur',
        nomorSurat: '090 / 1234 / 35.73.100 / 2026',
        namaPegawai: '',
        nipPegawai: '',
        pangkatGol: '',
        jabatan: '',
        maksudTugas: '',
        tujuan: '',
        tglBerangkat: '',
        tglKembali: '',
        lamaTugas: '',
        alatAngkut: 'Kendaraan Dinas',
        bebanAnggaran: 'APBD TA 2026',
        kotaTanggal: 'Malang, 26 Agustus 2026',
        jabatanPenandatangan: 'Kepala Dinas Kominfo',
        namaPenandatangan: 'Dr. Ir. H. Ahmad Fauzi, M.T.',
        nipPenandatangan: '19700315 199503 1 002'
      }
    };

    // Router Utama
    function renderApp() {
      const appNode = document.getElementById('app');
      if (state.currentPage === 'landing') {
        renderLandingPage(appNode);
      } else if (state.currentPage === 'dashboard') {
        renderDashboardPage(appNode);
      } else if (state.currentPage === 'generator') {
        renderGeneratorPage(appNode);
      }
    }

    function navigateTo(page) {
      state.currentPage = page;
      renderApp();
    }

    // Auth & Modal Handler
    function toggleLoginModal(show) {
      const modal = document.getElementById('loginModal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }

    function handleLogin(e) {
      e.preventDefault();
      const userVal = document.getElementById('loginUser').value;
      state.isLoggedIn = true;
      state.user = { name: userVal || 'Admin Demo' };
      toggleLoginModal(false);
      navigateTo('dashboard');
    }

    function handleLogout() {
      state.isLoggedIn = false;
      state.user = null;
      navigateTo('landing');
    }

    // Template Sidebar Navigasi
    function getSidebarHTML(activeMenu) {
      return `
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between min-h-screen no-print">
          <div>
            <div class="p-5 border-b border-slate-800 flex items-center gap-3">
              <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xs">GS</div>
              <span class="font-bold text-white text-base tracking-tight">Surat & SPD</span>
            </div>
            <nav class="p-4 space-y-1">
              <button onclick="navigateTo('landing')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${activeMenu === 'landing' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 hover:text-white transition'}">
                <span>🏠</span> Halaman Depan
              </button>
              <button onclick="navigateTo('dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${activeMenu === 'dashboard' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 hover:text-white transition'}">
                <span>📊</span> Dashboard
              </button>
              <button onclick="buatPenugasanBaru()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold ${activeMenu === 'generator' ? 'bg-blue-600 text-white' : 'hover:bg-slate-800 hover:text-white transition'}">
                <span>➕</span> Penugasan Baru
              </button>
            </nav>
          </div>
          <div class="p-4 border-t border-slate-800">
            ${state.isLoggedIn ? `
              <div class="mb-3 px-2">
                <p class="text-[10px] text-slate-400">Pengguna Aktif:</p>
                <p class="text-xs font-bold text-white truncate">${state.user.name}</p>
              </div>
              <button onclick="handleLogout()" class="w-full bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white py-2 rounded-lg text-xs font-bold transition">Keluar</button>
            ` : `
              <button onclick="toggleLoginModal(true)" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg text-xs font-bold transition">Masuk Akses</button>
            `}
          </div>
        </aside>
      `;
    }

    // 1. HALAMAN DEPAN
    function renderLandingPage(container) {
      container.innerHTML = `
        <header class="bg-white border-b sticky top-0 z-40">
          <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('landing')">
              <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xs">GS</div>
              <span class="font-bold text-lg text-slate-900">GeneratorSurat</span>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="navigateTo('dashboard')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold px-4 py-2 rounded-lg transition">Dashboard</button>
              ${state.isLoggedIn ? `
                <button onclick="handleLogout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-semibold px-4 py-2 rounded-lg transition">Keluar</button>
              ` : `
                <button onclick="toggleLoginModal(true)" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">Masuk</button>
              `}
            </div>
          </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-20 text-center flex-grow">
          <span class="bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1 rounded-full border border-blue-100">✨ Sistem Manajerial Perjalanan Dinas</span>
          <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 mt-4 mb-6 leading-tight">Kelola & Buat Surat Penugasan <br/>Dalam Hitungan Detik</h1>
          <p class="text-slate-600 max-w-2xl mx-auto mb-8 text-base">Platform pembuat dokumen instansi otomatis. Buat Surat Tugas dan Surat Perjalanan Dinas (SPD) resmi secara instan.</p>
          <div class="flex gap-4 justify-center">
            <button onclick="buatPenugasanBaru()" class="px-8 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition">Buat Penugasan Baru &rarr;</button>
            <button onclick="navigateTo('dashboard')" class="px-8 py-3.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl transition">Buka Dashboard</button>
          </div>
        </main>
      `;
    }

    // 2. HALAMAN DASHBOARD (DENGAN SIDEBAR & STATE KOSONG)
    function renderDashboardPage(container) {
      const totalPenugasan = state.riwayatPenugasan.length;
      
      container.innerHTML = `
        <div class="flex min-h-screen bg-slate-50">
          ${getSidebarHTML('dashboard')}
          
          <main class="flex-1 p-8 overflow-y-auto">
            <div class="flex justify-between items-center mb-8">
              <div>
                <h1 class="text-2xl font-bold text-slate-900">Dashboard Penugasan</h1>
                <p class="text-xs text-slate-500">Ringkasan status penugasan dinas pegawai</p>
              </div>
              <button onclick="buatPenugasanBaru()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold px-4 py-2 rounded-lg shadow transition">
                + Penugasan Baru
              </button>
            </div>

            <!-- Stat Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
              <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-slate-500 uppercase">Total Surat Diterbitkan</p>
                <p class="text-3xl font-extrabold text-slate-900 mt-2">${totalPenugasan}</p>
              </div>
              <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-slate-500 uppercase">Tugas Aktif/Berjalan</p>
                <p class="text-3xl font-extrabold text-blue-600 mt-2">0</p>
              </div>
              <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs font-semibold text-slate-500 uppercase">Selesai</p>
                <p class="text-3xl font-extrabold text-emerald-600 mt-2">0</p>
              </div>
            </div>

            <!-- Tabel Riwayat Penugasan -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h2 class="font-bold text-slate-800">Daftar Penugasan Terbaru</h2>
              </div>
              
              ${totalPenugasan === 0 ? `
                <div class="p-12 text-center">
                  <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">📋</div>
                  <h3 class="font-bold text-slate-700 mb-1">Belum Ada Penugasan</h3>
                  <p class="text-xs text-slate-500 mb-6">Daftar penugasan masih kosong. Silakan buat dokumen penugasan baru.</p>
                  <button onclick="buatPenugasanBaru()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-lg shadow transition">
                    + Buat Penugasan Baru
                  </button>
                </div>
              ` : `
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-slate-700 uppercase text-xs font-bold border-b">
                      <tr>
                        <th class="p-4">ID / No. Surat</th>
                        <th class="p-4">Nama Pegawai</th>
                        <th class="p-4">Maksud Tugas</th>
                        <th class="p-4">Tujuan</th>
                        <th class="p-4">Tanggal</th>
                        <th class="p-4 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      ${state.riwayatPenugasan.map(item => `
                        <tr class="hover:bg-slate-50">
                          <td class="p-4 font-mono font-medium text-slate-900">${item.id}</td>
                          <td class="p-4 font-semibold text-slate-800">${item.namaPegawai}</td>
                          <td class="p-4 max-w-xs truncate">${item.maksudTugas}</td>
                          <td class="p-4">${item.tujuan}</td>
                          <td class="p-4 text-xs whitespace-nowrap">${item.tglBerangkat} s/d ${item.tglKembali}</td>
                          <td class="p-4 text-center">
                            <button onclick="editPenugasan('${item.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-1.5 rounded font-medium">Edit / Cetak</button>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          </main>
        </div>
      `;
    }

    // 3. HALAMAN GENERATOR (EDITOR SURAT DENGAN SIDEBAR)
    function renderGeneratorPage(container) {
      const d = state.formData;
      container.innerHTML = `
        <div class="flex min-h-screen bg-slate-50">
          ${getSidebarHTML('generator')}

          <main class="flex-1 p-6 overflow-y-auto">
            <div class="mb-4 flex justify-between items-center no-print">
              <span class="text-xs font-bold bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Mode Edit Surat Tugas & SPD</span>
              <button onclick="simpanKeRiwayat()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-lg shadow transition">
                Simpan ke Dashboard
              </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <!-- Form Input -->
              <div class="lg:col-span-5 bg-white p-6 rounded-xl shadow-md h-fit no-print">
                <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b">Form Penugasan</h2>
                <form onsubmit="return false;" class="space-y-4 max-h-[65vh] overflow-y-auto pr-2">
                  
                  <div class="bg-slate-50 p-3 rounded-lg border">
                    <h3 class="text-xs font-bold text-slate-500 uppercase mb-2">Data Pegawai Ditugaskan</h3>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                      <input type="text" id="inputNamaPegawai" value="${d.namaPegawai}" placeholder="Nama Pegawai & Gelar" class="col-span-2 p-2 border rounded" />
                      <input type="text" id="inputNipPegawai" value="${d.nipPegawai}" placeholder="NIP / NIK" class="p-2 border rounded" />
                      <input type="text" id="inputPangkatGol" value="${d.pangkatGol}" placeholder="Pangkat / Golongan" class="p-2 border rounded" />
                      <input type="text" id="inputJabatan" value="${d.jabatan}" placeholder="Jabatan" class="col-span-2 p-2 border rounded" />
                    </div>
                  </div>

                  <div class="bg-slate-50 p-3 rounded-lg border">
                    <h3 class="text-xs font-bold text-slate-500 uppercase mb-2">Detail Perjalanan</h3>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                      <textarea id="inputMaksudTugas" rows="2" placeholder="Maksud Perjalanan Dinas" class="col-span-2 p-2 border rounded">${d.maksudTugas}</textarea>
                      <input type="text" id="inputTujuan" value="${d.tujuan}" placeholder="Kota / Tempat Tujuan" class="col-span-2 p-2 border rounded" />
                      <div>
                        <label class="block text-[10px] text-slate-500">Tgl Berangkat</label>
                        <input type="date" id="inputTglBerangkat" value="${d.tglBerangkat}" class="w-full p-2 border rounded" />
                      </div>
                      <div>
                        <label class="block text-[10px] text-slate-500">Tgl Kembali</label>
                        <input type="date" id="inputTglKembali" value="${d.tglKembali}" class="w-full p-2 border rounded" />
                      </div>
                      <input type="text" id="inputLamaTugas" value="${d.lamaTugas}" placeholder="Lama Tugas (misal: 3 Hari)" class="col-span-2 p-2 border rounded" />
                    </div>
                  </div>

                </form>

                <div class="mt-6 flex gap-2 border-t pt-4">
                  <button onclick="simpanKeRiwayat()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded text-xs font-bold shadow">Simpan Ke Dashboard</button>
                  <button onclick="downloadPDF()" class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded text-xs font-bold shadow">Unduh PDF</button>
                </div>
              </div>

              <!-- Live Preview Paper -->
              <div class="lg:col-span-7 flex justify-center">
                <div id="paper" class="bg-white w-full max-w-[210mm] min-h-[297mm] p-10 shadow-2xl border text-black font-serif text-xs leading-normal">
                  <!-- Dynamic Content -->
                </div>
              </div>
            </div>
          </main>
        </div>
      `;

      attachGeneratorEvents();
      renderPreview();
    }

    // LOGIKA PENUGASAN BARU & SIMPAN
    function buatPenugasanBaru() {
      const randomId = Math.floor(1000 + Math.random() * 9000);
      state.formData = {
        ...state.formData,
        nomorSurat: `090 / ${randomId} / 35.73.100 / 2026`,
        namaPegawai: '',
        nipPegawai: '',
        pangkatGol: '',
        jabatan: '',
        maksudTugas: '',
        tujuan: '',
        tglBerangkat: '',
        tglKembali: '',
        lamaTugas: ''
      };
      navigateTo('generator');
    }

    function simpanKeRiwayat() {
      if (!state.formData.namaPegawai) {
        alert('Harap isi nama pegawai terlebih dahulu!');
        return;
      }

      const numPart = state.formData.nomorSurat.split('/')[1] ? state.formData.nomorSurat.split('/')[1].trim() : 'NEW';
      const newItem = {
        id: `SPD-${numPart}`,
        namaPegawai: state.formData.namaPegawai,
        maksudTugas: state.formData.maksudTugas || '-',
        tujuan: state.formData.tujuan || '-',
        tglBerangkat: state.formData.tglBerangkat || '-',
        tglKembali: state.formData.tglKembali || '-',
        status: 'Berjalan'
      };

      state.riwayatPenugasan.unshift(newItem);
      alert('Penugasan berhasil disimpan ke dashboard!');
      navigateTo('dashboard');
    }

    function editPenugasan(id) {
      const item = state.riwayatPenugasan.find(r => r.id === id);
      if (item) {
        state.formData.namaPegawai = item.namaPegawai;
        state.formData.maksudTugas = item.maksudTugas;
        state.formData.tujuan = item.tujuan;
        state.formData.tglBerangkat = item.tglBerangkat;
        state.formData.tglKembali = item.tglKembali;
        navigateTo('generator');
      }
    }

    function attachGeneratorEvents() {
      const fields = ['NamaPegawai', 'NipPegawai', 'PangkatGol', 'Jabatan', 'MaksudTugas', 'Tujuan', 'TglBerangkat', 'TglKembali', 'LamaTugas'];
      fields.forEach(f => {
        const el = document.getElementById(`input${f}`);
        if (el) {
          el.addEventListener('input', (e) => {
            const key = f.charAt(0).toLowerCase() + f.slice(1);
            state.formData[key] = e.target.value;
            renderPreview();
          });
        }
      });
    }

    function renderPreview() {
      const paper = document.getElementById('paper');
      const d = state.formData;

      paper.innerHTML = `
        <div class="text-center border-b-4 border-double border-black pb-2 mb-4">
          <h3 class="font-bold text-sm uppercase">${d.namaInstansi}</h3>
          <h2 class="font-bold text-base uppercase">${d.unitKerja}</h2>
          <p class="text-[10px] italic">${d.alamatInstansi}</p>
        </div>
        <div class="text-center mb-6">
          <h1 class="font-bold text-sm underline uppercase">SURAT TUGAS</h1>
          <p class="text-xs">Nomor: ${d.nomorSurat}</p>
        </div>
        <p class="mb-3">Yang bertanda tangan di bawah ini memberi tugas kepada:</p>
        <table class="w-full mb-4 ml-4 text-xs">
          <tr><td class="w-28 py-0.5">Nama</td><td>: <b>${d.namaPegawai || '[Nama Pegawai]'}</b></td></tr>
          <tr><td class="py-0.5">NIP</td><td>: ${d.nipPegawai || '-'}</td></tr>
          <tr><td class="py-0.5">Pangkat/Gol</td><td>: ${d.pangkatGol || '-'}</td></tr>
          <tr><td class="py-0.5">Jabatan</td><td>: ${d.jabatan || '-'}</td></tr>
        </table>
        <p class="mb-4 leading-relaxed">Untuk melaksanakan tugas <b>${d.maksudTugas || '[Maksud Tugas]'}</b> yang berlokasi di <b>${d.tujuan || '[Tujuan]'}</b> selama ${d.lamaTugas || '[Lama Tugas]'}.</p>
        
        <div class="mt-16 flex justify-end">
          <div class="text-center w-60">
            <p>${d.kotaTanggal}</p>
            <p class="font-bold mb-16">${d.jabatanPenandatangan}</p>
            <p class="font-bold underline">${d.namaPenandatangan}</p>
            <p class="text-[10px]">NIP. ${d.nipPenandatangan}</p>
          </div>
        </div>
      `;
    }

    function downloadPDF() {
      const element = document.getElementById('paper');
      const opt = {
        margin:       10,
        filename:     `Surat_Tugas_${state.formData.namaPegawai || 'Dokumen'}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    // Inisialisasi Aplikasi
    document.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
